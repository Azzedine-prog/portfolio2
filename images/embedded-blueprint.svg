<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Circuit board inspired background</title>
  <desc id="desc">A deep blue gradient background with turquoise circuit traces representing automotive embedded systems.</desc>
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d1c" />
      <stop offset="45%" stop-color="#0a1f3c" />
      <stop offset="100%" stop-color="#10385c" />
    </linearGradient>
    <linearGradient id="traceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ed4ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7a8bff" stop-opacity="0.35" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#4dd7ff" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#2d8cff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#0f2745" stroke-width="1" />
      <path d="M40 0V80M0 40H80" fill="none" stroke="#123458" stroke-width="0.5" />
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bgGradient)" />
  <rect width="1600" height="1000" fill="url(#grid)" opacity="0.35" />
  <circle cx="400" cy="300" r="320" fill="url(#glow)" />
  <circle cx="1280" cy="720" r="360" fill="url(#glow)" />
  <g stroke="url(#traceGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M260 160h140v120l80 80v160l140 140" />
    <path d="M1340 220h-160l-120 120v140l-160 160v120" />
    <path d="M520 760h180l100-100v-120l90-90h160" />
    <path d="M180 560h220l140-140v-160l120-120" />
  </g>
  <g fill="#4ed4ff" fill-opacity="0.55">
    <circle cx="260" cy="160" r="6" />
    <circle cx="400" cy="160" r="6" />
    <circle cx="400" cy="280" r="6" />
    <circle cx="480" cy="360" r="6" />
    <circle cx="480" cy="520" r="6" />
    <circle cx="620" cy="660" r="6" />
    <circle cx="780" cy="660" r="6" />
    <circle cx="900" cy="540" r="6" />
    <circle cx="1040" cy="420" r="6" />
    <circle cx="1180" cy="420" r="6" />
    <circle cx="1180" cy="300" r="6" />
    <circle cx="1340" cy="220" r="6" />
    <circle cx="1340" cy="380" r="6" />
    <circle cx="1180" cy="580" r="6" />
    <circle cx="1020" cy="700" r="6" />
    <circle cx="860" cy="820" r="6" />
  </g>
</svg>
